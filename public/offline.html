<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0718">
<title>চিত্রপট — নেট নেই</title>
<style>
:root{--bg:#0a0718;--ink:#eef0f4;--muted:#9aa1ae;--accent:#8b5cf6;color-scheme:dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.6 "Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;padding:24px 16px;text-align:center}
img{width:72px;height:72px}
p{color:var(--muted);max-width:320px;margin:8px auto 20px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 22px;background:var(--accent);color:#fff;cursor:pointer}
</style>
</head>
<body>
<main>
  <img src="/logo.png" alt="">
  <h1 id="h" style="font-size:22px;margin:12px 0 0">ইন্টারনেট নেই</h1>
  <p id="p">নেট চালু করে আবার চেষ্টা করো</p>
  <button id="retry">আবার চেষ্টা করো</button>
</main>
<script src="/offline.js"></script>
</body>
</html>

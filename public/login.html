<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0718">
<title>Ruvo — লগইন</title>
<link rel="icon" href="/api/brand/favicon" type="image/png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/api/brand/apple">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/login.css?v=__V__">
</head>
<body>
<main class="wrap">
  <button type="button" id="langBtn" class="langtop notr" aria-label="Language">🌐</button>
  <section class="art" aria-hidden="true">
    <div class="ring"></div>
    <img class="owner" src="/api/brand/owner" alt="" fetchpriority="high">
  </section>
  <section class="card">
    <div class="brand"><img src="/api/brand/logo" alt=""><div><b>Ruvo</b><small>AI ক্রিয়েটিভ স্টুডিও</small></div></div>
    <p class="tag" id="tag">ভাবো। বানাও। অনুপ্রাণিত করো।</p>
    <ul>
      <li>ছবি · ভিডিও · কণ্ঠ · গল্প</li>
      <li>প্রতিটা দৃশ্যে একই চরিত্র</li>
      <li>ফোনে অ্যাপের মতো</li>
    </ul>
    <div id="g"></div>
    <button id="guestGo" type="button" class="guest" hidden>👀 অতিথি হিসেবে ঢোকো <small>Gmail ছাড়া ঘুরে দেখো</small></button>
    <button id="installBtn" type="button" class="install" hidden>📲 ফোনে অ্যাপ হিসেবে ইনস্টল করো</button>
    <details id="howto" class="howto"><summary>📲 ইনস্টল করার নিয়ম</summary>
      <p><b>Android (Chrome):</b> ⋮ → Install app</p>
      <p><b>iPhone (Safari):</b> Share ⬆️ → Add to Home Screen</p></details>
    <div class="dev" id="dev" hidden>
      <input id="devName" placeholder="পরীক্ষার নাম" aria-label="পরীক্ষার নাম">
      <button id="devGo" type="button">ঢোকো</button>
    </div>
    <p class="err" id="err" role="alert" hidden></p>
    <small class="note">অনুমতি পাওয়া Gmail দিয়ে ঢোকো</small>
    <div class="contact" id="contact" hidden><p>সাহায্য দরকার?</p><div class="ctas" id="ctas"></div></div>
  </section>
</main>
<script src="/i18n.js?v=__V__" defer></script>
<script src="/i18n-en.js?v=__V__" defer></script>
<script src="/login.js?v=__V__" defer></script>
</body>
</html>
